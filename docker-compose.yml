services:
  db:
    image: postgres:15-alpine
    container_name: zoom_postgres_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: zoom_web_app
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
